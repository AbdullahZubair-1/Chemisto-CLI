[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemisto-cli"
version = "0.1.0"
description = "Chemisto - a Claude Code-style AI coding assistant that runs in the terminal, backed by a FastAPI gateway to OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abdullah Zubair" }]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "pydantic>=2.6",
]

[project.optional-dependencies]
gateway = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
chemisto = "chemisto.cli:main"

[tool.setuptools.packages.find]
include = ["chemisto*", "gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
